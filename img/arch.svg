<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Inter,Arial,sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c6f24e"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4fd1c5"/></marker>
<style>.L{font:700 12.5px 'JetBrains Mono',monospace;fill:#c6f24e;letter-spacing:1px}.b{fill:#10221e;stroke:#2f5a50;stroke-width:1.5}.k{fill:#1a1f0c;stroke:#c6f24e;stroke-width:1.8}.t{font-size:13.5px;font-weight:700;fill:#e8f3ef}.s{font-size:11px;fill:#93ada6}.a{stroke:#c6f24e;stroke-width:2;fill:none;marker-end:url(#ar)}.ab{stroke:#4fd1c5;stroke-width:2;fill:none;marker-end:url(#ab);stroke-dasharray:6 4}.lane{fill:#0c1a17;stroke:#1d3832}.lg{font-size:11.5px;fill:#e8f3ef}</style>
</defs>
<rect width="1280" height="720" fill="#07110f"/>
<text x="16" y="26" font-size="17" font-weight="700" fill="#e8f3ef">GridWise data platform: streaming + batch (lambda-style) architecture</text>
<g transform="translate(860,12)"><line x1="0" y1="10" x2="34" y2="10" class="a"/><text x="40" y="14" class="lg">streaming / hot path</text><line x1="190" y1="10" x2="224" y2="10" class="ab"/><text x="230" y="14" class="lg">batch / cold path</text></g>
<!-- lanes -->
<rect class="lane" x="10" y="52" width="180" height="500" rx="14"/><text class="L" x="22" y="72">1 SOURCES</text>
<rect class="lane" x="205" y="52" width="170" height="500" rx="14"/><text class="L" x="217" y="72">2 INGESTION</text>
<rect class="lane" x="390" y="52" width="210" height="500" rx="14"/><text class="L" x="402" y="72">3 PROCESSING</text>
<rect class="lane" x="615" y="52" width="190" height="500" rx="14"/><text class="L" x="627" y="72">4 STORAGE</text>
<rect class="lane" x="820" y="52" width="200" height="500" rx="14"/><text class="L" x="832" y="72">5 ANALYTICS / ML</text>
<rect class="lane" x="1035" y="52" width="235" height="500" rx="14"/><text class="L" x="1047" y="72">6 API · APPLICATION</text>
<!-- sources -->
<rect class="b" x="22" y="88" width="156" height="58" rx="10"/><text class="t" x="34" y="110">Smart meters</text><text class="s" x="34" y="128">kW per channel / 10 s</text>
<rect class="b" x="22" y="156" width="156" height="58" rx="10"/><text class="t" x="34" y="178">Inverters + BMS</text><text class="s" x="34" y="196">solar, battery SoC (MQTT)</text>
<rect class="b" x="22" y="224" width="156" height="58" rx="10"/><text class="t" x="34" y="246">Generator sensors</text><text class="s" x="34" y="264">run status, fuel</text>
<rect class="b" x="22" y="292" width="156" height="58" rx="10"/><text class="t" x="34" y="314">CSV / bill uploads</text><text class="s" x="34" y="332">from the web app</text>
<rect class="b" x="22" y="360" width="156" height="58" rx="10"/><text class="t" x="34" y="382">Tariffs + weather</text><text class="s" x="34" y="400">NEPRA/KE, Open-Meteo</text>
<rect class="b" x="22" y="428" width="156" height="66" rx="10" stroke-dasharray="4 3"/><text class="t" x="34" y="450">Synthetic simulator</text><text class="s" x="34" y="468">50–500 Karachi sites</text><text class="s" x="34" y="484">(prototype data)</text>
<!-- ingestion -->
<rect class="k" x="217" y="110" width="146" height="150" rx="10"/><text class="t" x="229" y="134">Apache Kafka</text><text class="s" x="229" y="154">topic telemetry.raw</text><text class="s" x="229" y="171">12 partitions (site_id)</text><text class="s" x="229" y="188">7-day retention, replay</text><text class="s" x="229" y="205">topic alerts (out)</text><text class="s" x="229" y="230">MQTT bridge for IoT</text>
<rect class="b" x="217" y="300" width="146" height="90" rx="10"/><text class="t" x="229" y="324">FastAPI upload</text><text class="s" x="229" y="344">schema + QC checks</text><text class="s" x="229" y="361">→ raw file to lake</text>
<rect class="b" x="217" y="402" width="146" height="70" rx="10"/><text class="t" x="229" y="426">Airflow pulls</text><text class="s" x="229" y="446">tariff + weather daily</text>
<!-- processing -->
<rect class="k" x="402" y="92" width="186" height="168" rx="10"/><text class="t" x="414" y="116">Spark Structured</text><text class="t" x="414" y="134">Streaming</text><text class="s" x="414" y="154">10 s micro-batches</text><text class="s" x="414" y="171">10 min watermark</text><text class="s" x="414" y="188">15-min window aggregates</text><text class="s" x="414" y="205">live alerts (stream-static</text><text class="s" x="414" y="222">join with site profiles)</text><text class="s" x="414" y="242">exactly-once checkpoints</text>
<rect class="b" x="402" y="282" width="186" height="134" rx="10"/><text class="t" x="414" y="306">Spark batch ETL</text><text class="s" x="414" y="326">dedupe, validate, quarantine</text><text class="s" x="414" y="343">resample to hourly silver</text><text class="s" x="414" y="360">features (lags, weather)</text><text class="s" x="414" y="377">quality report → DQ gate</text><text class="s" x="414" y="400">2–N workers (scale out)</text>
<rect class="b" x="402" y="430" width="186" height="104" rx="10"/><text class="t" x="414" y="454">Apache Airflow</text><text class="s" x="414" y="474">DAG gridwise_daily 01:30</text><text class="s" x="414" y="491">ETL → DQ gate → train →</text><text class="s" x="414" y="508">plan → export, retries,</text><text class="s" x="414" y="525">failure e-mail</text>
<!-- storage -->
<rect class="b" x="627" y="88" width="166" height="250" rx="10"/><text class="t" x="639" y="112">Data lake</text><text class="s" x="639" y="130">MinIO / S3 · Parquet</text>
<rect x="639" y="142" width="142" height="40" rx="7" fill="#2a1d10" stroke="#ffb547"/><text x="649" y="160" font-size="12" font-weight="700" fill="#ffb547">bronze</text><text x="649" y="175" font-size="10.5" fill="#93ada6">raw events, by date</text>
<rect x="639" y="190" width="142" height="40" rx="7" fill="#1b2326" stroke="#c0c8cc"/><text x="649" y="208" font-size="12" font-weight="700" fill="#e8f3ef">silver</text><text x="649" y="223" font-size="10.5" fill="#93ada6">clean hourly, features</text>
<rect x="639" y="238" width="142" height="40" rx="7" fill="#262110" stroke="#e6c34a"/><text x="649" y="256" font-size="12" font-weight="700" fill="#e6c34a">gold</text><text x="649" y="271" font-size="10.5" fill="#93ada6">forecasts, alerts, plans</text>
<rect x="639" y="286" width="142" height="40" rx="7" fill="#2a1414" stroke="#ff6b6b"/><text x="649" y="304" font-size="12" font-weight="700" fill="#ff6b6b">quarantine</text><text x="649" y="319" font-size="10.5" fill="#93ada6">bad rows + reason</text>
<rect class="b" x="627" y="352" width="166" height="96" rx="10"/><text class="t" x="639" y="376">TimescaleDB</text><text class="s" x="639" y="396">serving: hypertables,</text><text class="s" x="639" y="413">compression, tenant RLS</text><text class="s" x="639" y="430">users, sites, plans</text>
<rect class="b" x="627" y="462" width="166" height="72" rx="10"/><text class="t" x="639" y="486">MLflow registry</text><text class="s" x="639" y="506">models, params, metrics</text><text class="s" x="639" y="522">versioned artifacts</text>
<!-- ML -->
<rect class="b" x="832" y="92" width="176" height="96" rx="10"/><text class="t" x="844" y="116">Demand forecast</text><text class="s" x="844" y="136">Spark MLlib GBT (global)</text><text class="s" x="844" y="153">vs seasonal-naive</text><text class="s" x="844" y="170">MAE −33%, MAPE 9.9%</text>
<rect class="b" x="832" y="200" width="176" height="96" rx="10"/><text class="t" x="844" y="224">Wastage / anomaly</text><text class="s" x="844" y="244">robust z on residuals</text><text class="s" x="844" y="261">per operating band</text><text class="s" x="844" y="278">F1 0.56 vs 0.15 baseline</text>
<rect class="b" x="832" y="308" width="176" height="96" rx="10"/><text class="t" x="844" y="332">Energy-mix planner</text><text class="s" x="844" y="352">LP per site/day (PuLP)</text><text class="s" x="844" y="369">distributed over Spark</text><text class="s" x="844" y="386">generator −6.8%</text>
<rect class="b" x="832" y="416" width="176" height="118" rx="10"/><text class="t" x="844" y="440">Cost &amp; savings</text><text class="s" x="844" y="460">backtest plan vs actual</text><text class="s" x="844" y="477">wastage avoided (Rs)</text><text class="s" x="844" y="494">per site / type / month</text><text class="s" x="844" y="518">→ gold tables</text>
<!-- API/app -->
<rect class="k" x="1047" y="92" width="211" height="150" rx="10"/><text class="t" x="1059" y="116">GridWise API (FastAPI)</text><text class="s" x="1059" y="136">/auth/login (signed token)</text><text class="s" x="1059" y="153">/sites/{id}/forecast · /alerts</text><text class="s" x="1059" y="170">/sites/{id}/plan · /report</text><text class="s" x="1059" y="187">/upload · /quality</text><text class="s" x="1059" y="204">/metrics (Prometheus)</text><text class="s" x="1059" y="226">roles: manager/owner/admin</text>
<rect class="k" x="1047" y="256" width="211" height="150" rx="10"/><text class="t" x="1059" y="280">GridWise web app</text><text class="s" x="1059" y="300">sign-in · sidebar navigation</text><text class="s" x="1059" y="317">Forecast · Alerts · Planner</text><text class="s" x="1059" y="334">Cost &amp; Savings · Upload &amp; QC</text><text class="s" x="1059" y="351">Platform status · Settings</text><text class="s" x="1059" y="373">hosted on Vercel (CDN)</text><text class="s" x="1059" y="390">+ company website</text>
<g font-size="12" fill="#e8f3ef"><text x="1059" y="436">👤 Facility manager: act on alerts/plan</text><text x="1059" y="458">👤 Owner/finance: cost &amp; savings</text><text x="1059" y="480">👤 Admin: data quality, platform</text><text x="1059" y="508" fill="#93ada6" font-size="11">📱 Alerts: e-mail / WhatsApp (roadmap)</text></g>
