<!-- bottom bars -->
<rect x="10" y="566" width="1260" height="44" rx="12" fill="#1a1410" stroke="#ffb547"/><text x="26" y="593" font-size="13.5" fill="#ffb547" font-weight="700">🔒 SECURITY</text><text x="140" y="593" font-size="12" fill="#e8f3ef">HTTPS/TLS · signed tokens + roles · tenant row-level security in TimescaleDB · encrypted lake buckets · consent &amp; data-sharing agreement · secrets in env/vault · pseudonymised site IDs</text>
<rect x="10" y="618" width="1260" height="44" rx="12" fill="#0f1a24" stroke="#4fd1c5"/><text x="26" y="645" font-size="13.5" fill="#4fd1c5" font-weight="700">📡 MONITORING</text><text x="152" y="645" font-size="12" fill="#e8f3ef">Prometheus + Grafana: API latency/errors, Spark streaming rows/s, Kafka consumer lag, DAG failures · DQ gate (clean ≥ 95%) · forecast drift (weekly MAE) · alert feedback rate</text>
<rect x="10" y="670" width="1260" height="40" rx="12" fill="#121a0b" stroke="#c6f24e"/><text x="26" y="695" font-size="13.5" fill="#c6f24e" font-weight="700">🚀 DEPLOY &amp; SCALE</text><text x="168" y="695" font-size="12" fill="#e8f3ef">Docker Compose (single VM, pilot) → Kubernetes / managed Kafka + EMR/Databricks at 500+ sites · add Kafka partitions &amp; Spark workers · web app on Vercel</text>
</svg>
